<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Skyscraper sample · The Speed of Years</title>
<style>
  @font-face { font-family: 'Archivo'; font-weight: 100 900; font-stretch: 62% 125%; src: url(../fonts/archivo.woff2) format('woff2'); }
  @font-face { font-family: 'Newsreader'; font-weight: 300 700; src: url(../fonts/newsreader.woff2) format('woff2'); }
  :root { --ground: #ECEDF0; --ink: #1A1C22; --ink-2: #464A56; --muted: #666B7A; --line: #D3D6DE; --blue: #2E3BF0; --raised: #F6F7F9; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 18px/1.5 Newsreader, Georgia, serif; }
  .shell { max-width: 1180px; margin: 0 auto; padding: 32px clamp(16px, 4vw, 48px) 64px; }
  .note { font-family: Archivo, sans-serif; font-size: 13px; color: var(--muted); margin: 0 0 24px; }
  .wrap { display: grid; grid-template-columns: minmax(280px, 5fr) 7fr; gap: clamp(28px, 5vw, 64px); align-items: center; }
  .num { font-family: Archivo, sans-serif; font-weight: 850; font-stretch: 125%; font-size: clamp(72px, 9vw, 140px); line-height: .85; letter-spacing: -0.03em; color: var(--blue); margin: 0 0 16px; font-variant-numeric: tabular-nums; }
  .cap { font-size: clamp(21px, 2.1vw, 27px); line-height: 1.3; margin: 0 0 24px; max-width: 16em; }
  .inputs { font-family: Archivo, sans-serif; font-size: 14px; color: var(--ink-2); display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  .inputs input { width: 3.4em; font: 600 15px Archivo, sans-serif; color: var(--blue); border: 1.5px solid var(--line); border-radius: 8px; padding: 4px 6px; background: var(--raised); }
  .switch { font-family: Archivo, sans-serif; display: inline-grid; grid-template-columns: 1fr 1fr; background: var(--raised); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
  .switch button { border: 0; background: none; font: 600 15px Archivo, sans-serif; padding: 10px 18px; border-radius: 999px; cursor: pointer; color: var(--ink); }
  .switch button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
  .replay { font: 600 15px Archivo, sans-serif; margin-left: 12px; background: none; border: 0; text-decoration: underline; text-underline-offset: 4px; color: var(--ink-2); cursor: pointer; }
  #sky { display: block; width: 100%; border-radius: 18px; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="shell">
  <p class="note">Sample only, not linked from the site. Each floor is a year, each window a week. The basement holds the years before your first memory.</p>
  <div class="wrap">
    <div>
      <div class="inputs">
        <label>Age <input id="age" type="number" value="30" min="1" max="120"></label>
        <label>Lifespan <input id="life" type="number" value="80" min="2" max="120"></label>
        <label>First memory <input id="mem" type="number" value="3" min="1" max="20"></label>
      </div>
      <p class="num" id="num">0%</p>
      <p class="cap" id="cap"></p>
      <div class="switch" id="switch">
        <button type="button" data-m="felt" aria-pressed="true">How it feels</button>
        <button type="button" data-m="cal" aria-pressed="false">On the calendar</button>
      </div>
      <button class="replay" id="replay" type="button">Light it up again</button>
    </div>
    <canvas id="sky" aria-label="A skyscraper of your life: one floor per year, lit windows are weeks lived"></canvas>
  </div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const cv = $('sky'), ctx = cv.getContext('2d');
  let S, t = 1, sweep = 0, W = 0, H = 0, rnd = [], stars = [];

  function model() {
    const age = +$('age').value, life = +$('life').value, mem = +$('mem').value;
    if (!(age >= 0 && life > mem && mem >= 1)) return null;
    const sp = Math.sqrt(life) - Math.sqrt(mem);
    return {
      age, life, mem, total: Math.round(life * 52), lived: Math.min(Math.round(life * 52), Math.floor(age * 52)), memW: Math.floor(mem * 52),
      felt: a => a <= mem ? 0 : clamp01((Math.sqrt(a) - Math.sqrt(mem)) / sp),
      ageAt: f => (Math.sqrt(mem) + f * sp) ** 2,
    };
  }

  function size() {
    W = Math.round(cv.getBoundingClientRect().width);
    H = Math.round(Math.min(820, Math.max(520, innerHeight * 0.86)));
    const d = Math.min(2, devicePixelRatio || 1);
    cv.width = W * d; cv.height = H * d; cv.style.height = H + 'px';
    ctx.setTransform(d, 0, 0, d, 0, 0);
    // Fixed random values: star positions and the order windows switch on within a floor
    let seed = 7; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    stars = Array.from({ length: 70 }, () => [r(), r() * 0.7, r() * 1.2 + 0.3]);
    rnd = Array.from({ length: 52 * 125 }, r);
  }

  function draw(now = performance.now()) {
    if (!S) return;
    const s = S;
    // Sky
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0A0C24'); g.addColorStop(0.75, '#1C2266'); g.addColorStop(1, '#2E3BF0');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (const [x, y, rr] of stars) { ctx.globalAlpha = 0.35 + 0.4 * Math.sin(now / 900 + x * 40) ** 2; ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(x * W, y * H, rr, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#F4F1E6'; ctx.beginPath(); ctx.arc(W - 46, 46, 16, 0, 7); ctx.fill();
    ctx.fillStyle = '#0D1030'; ctx.beginPath(); ctx.arc(W - 39, 41, 14, 0, 7); ctx.fill();

    // Building frame
    const groundY = H - 56, topY = 72, bw = Math.min(W * 0.62, 420), bx = (W - bw) / 2;
    const span = groundY - topY, R = Math.ceil(s.life), m0 = Math.floor(s.mem);
    const spT = Math.sqrt(s.life) - Math.sqrt(s.mem);
    // Floors from first memory (bottom) to lifespan (top); felt vs calendar heights
    const floors = []; let yC = groundY, yF = groundY;
    for (let a = m0; a < R; a++) {
      const lo = Math.max(a, s.mem), hi = Math.min(a + 1, s.life);
      const hC = (hi - lo) / (s.life - s.mem) * span, hF = (Math.sqrt(hi) - Math.sqrt(lo)) / spT * span;
      const h = hC + (hF - hC) * t, top = (yC - hC) + ((yF - hF) - (yC - hC)) * t;
      floors.push({ a, top, h }); yC -= hC; yF -= hF;
    }
    const roofY = floors.length ? floors[floors.length - 1].top : topY;
    // Antenna with a blinking light
    ctx.strokeStyle = '#3A4180'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(W / 2, roofY); ctx.lineTo(W / 2, roofY - 44); ctx.stroke();
    ctx.fillStyle = Math.floor(now / 700) % 2 ? '#FF4D4D' : '#5A1E2A'; ctx.beginPath(); ctx.arc(W / 2, roofY - 46, 4, 0, 7); ctx.fill();
    // Facade
    ctx.fillStyle = '#151A44'; ctx.fillRect(bx - 8, roofY - 6, bw + 16, groundY - roofY + 6);
    ctx.fillStyle = '#1F2560'; ctx.fillRect(bx - 12, roofY - 10, bw + 24, 8);
    // Basement: years before the first memory, below ground
    ctx.fillStyle = '#2A2F45'; ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#3A3F58'; ctx.fillRect(bx - 8, groundY, bw + 16, 34);
    ctx.fillStyle = '#9AA2BC'; ctx.font = '600 11px Archivo, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(`Basement: before your first memory (0–${Math.round(s.mem)})`, W / 2, groundY + 21);

    // Windows: lit = lived weeks. They switch on floor by floor in a random order.
    const ageS = sweep >= 1 ? s.age : s.ageAt(s.felt(s.age) * sweep);
    const sweepW = ageS * 52, colW = bw / 52, gapX = Math.max(0.8, colW * 0.24);
    const blink = Math.floor(now / 600) % 2;
    for (const f of floors) {
      const gapY = Math.min(2.4, f.h * 0.3), wh = f.h - gapY;
      if (wh < 0.4) continue;
      const progress = clamp01((sweepW - f.a * 52) / 52);
      for (let w = 0; w < 52; w++) {
        const idx = f.a * 52 + w;
        if (idx < s.memW || idx >= s.total) continue;
        const lit = idx < s.lived && rnd[idx % rnd.length] < progress;
        const now_ = idx === s.lived && sweep >= 1;
        ctx.fillStyle = now_ ? (blink ? '#FFFFFF' : '#FFB347') : lit ? '#FFD27A' : '#262C66';
        ctx.fillRect(bx + w * colW + gapX / 2, f.top + gapY / 2, colW - gapX, wh);
      }
    }
    // Street
    ctx.fillStyle = '#10132E'; ctx.fillRect(0, groundY - 2, W, 4);

    // Labels: ages on the left, "You" on the right
    ctx.textAlign = 'right'; ctx.font = '500 11px Archivo, sans-serif'; ctx.fillStyle = '#AEB4D8';
    let last = -99;
    for (const f of floors) {
      const y = f.top + f.h / 2;
      if ((f.a % 10 === 0 || (t > .5 && f.h > 16) || f.a === m0) && Math.abs(y - last) > 14) { ctx.fillText(f.a, bx - 16, y + 4); last = y; }
    }
    const cur = floors.find(f => f.a === Math.floor(s.age));
    if (cur && sweep >= 1 && s.age < s.life) {
      const y = cur.top + cur.h / 2;
      ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(bx + bw + 12, y); ctx.lineTo(bx + bw + 26, y); ctx.stroke();
      ctx.textAlign = 'left'; ctx.font = '700 12px Archivo, sans-serif'; ctx.fillStyle = '#FFFFFF'; ctx.fillText('You', bx + bw + 30, y + 4);
    }
    // Readout
    const shown = t >= .5 ? s.felt(ageS) : Math.min(1, ageS / s.life);
    $('num').textContent = Math.round(shown * 100) + '%';
    $('num').style.fontStretch = (62 + 63 * t) + '%';
    $('cap').textContent = t >= .5 ? 'of your life may already feel lived.' : `of your life has actually passed: ${s.lived.toLocaleString('en-US')} of ${s.total.toLocaleString('en-US')} weeks.`;
  }

  // Continuous loop for the blinking lights and the animations
  let tTarget = 1, tFrom = 1, tStart = 0, sStart = 0;
  function loop(now) {
    if (tStart) { const p = clamp01((now - tStart) / 900); t = tFrom + (tTarget - tFrom) * ease(p); if (p >= 1) tStart = 0; }
    if (sStart) { const p = clamp01((now - sStart) / 4000); sweep = ease(p); if (p >= 1) sStart = 0; }
    draw(now);
    requestAnimationFrame(loop);
  }
  function light() { sweep = 0; sStart = performance.now(); }
  function update() { S = model(); size(); light(); }

  $('switch').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    $('switch').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    tFrom = t; tTarget = b.dataset.m === 'felt' ? 1 : 0; tStart = performance.now();
  }));
  $('replay').addEventListener('click', light);
  ['age', 'life', 'mem'].forEach(id => $(id).addEventListener('change', update));
  addEventListener('resize', () => { size(); draw(); });
  update(); requestAnimationFrame(loop);
  if (document.fonts) document.fonts.ready.then(() => draw());
})();
</script>
</body>
</html>
